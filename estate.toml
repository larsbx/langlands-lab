version = 1
template = "estate-repository-v1"

[repository]
id = "larsbx/langlands-lab"
kind = "research"
lifecycle = "active"
default_branch = "main"
layout_status = "canonical"

[principles]
ordering = ["authority", "domain", "language"]
empty_silos = "forbidden"
cross_language_disagreement = "fail_closed"
generated_surfaces = "derived_only"
vendor_code = "non_local"
experimental_code = "non_authoritative"

# The manifest is the whole policy plane: no policy/ silo is created for it.

[[plane]]
id = "policy"
target = "estate.toml"
authority = "governance"
required = true
current = ["estate.toml"]

[[plane]]
id = "kernel"
target = "kernel"
authority = "canonical_executable"
required = true
current = ["kernel"]

[[plane]]
id = "proof"
target = "proof"
authority = "claim_state"
required = true
current = ["proof"]

[[plane]]
id = "conformance"
target = "tests"
authority = "evidence"
required = true
current = ["tests"]

[[plane]]
id = "tooling"
target = "tools"
authority = "repository_tooling"
required = true
current = ["tools"]

[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["docs", "README.md", "ARCHITECTURE.md"]

[[language]]
name = "Python"
authority = "canonical"
roles = ["kernel"]
acceptance_authority = true

[[language]]
name = "Lean"
authority = "supporting"
roles = ["formal_proof_target", "oracle"]
acceptance_authority = false

[migration]
mode = "boundary_first"
mass_move = false
next = []

[governance]
repository = "larsbx/estate-governance"
revision = "c4852b614572c50753bfe1e947cdf80b91a67a73"

[governance.sha256]
"docs/architecture/estate-repository-template-v1.md" = "f500e010c425d3a6361235e48ac7fb69d80e59aff1a9abbbb730e8bf386fc311"
"tools/audit_estate_layout.py" = "1332328e8832037a6be2bcd8e3d5710008219997e79c3fabab81d5210a7d213e"
