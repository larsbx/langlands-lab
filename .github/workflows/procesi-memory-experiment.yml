name: Procesi memory experiment

on:
  pull_request:
    branches: [main]
    paths:
      - 'proof/langlands/LanglandsOracles/Pseudocharacter.lean'
      - 'tools/benchmark_lean_memory.py'
      - '.github/workflows/procesi-memory-experiment.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 7630927a8378b57a0fc0e7306d4402af44105103
          path: baseline
      - name: Install pinned Lean
        working-directory: candidate/proof/langlands
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Baseline clean build and audit
        run: python3 candidate/tools/benchmark_lean_memory.py --root baseline --output measurements/baseline
      - name: Candidate clean build and audit
        run: python3 candidate/tools/benchmark_lean_memory.py --root candidate --output measurements/candidate
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procesi-memory-${{ github.event.pull_request.head.sha }}
          path: measurements
