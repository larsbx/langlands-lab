name: CI

# One job per authority plane (ESTATE.toml). A plane's job fails, never skips,
# when its toolchain is missing.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  policy:
    name: policy (estate layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Estate audit (pinned estate-governance)
        env:
          ESTATE_GOVERNANCE_TOKEN: ${{ secrets.ESTATE_GOVERNANCE_TOKEN }}
        run: |
          rev=$(python3 -c 'import tomllib; print(next(d["rev"] for d in tomllib.load(open("ESTATE.toml", "rb"))["dep"] if d["id"] == "estate-governance"))')
          git clone -q "https://x-access-token:${ESTATE_GOVERNANCE_TOKEN}@github.com/larsbx/estate-governance" .estate
          git -C .estate checkout -q "$rev"
          python3 .estate/kernel/audit_estate_layout.py --root .

  kernel:
    name: kernel + conformance (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest --ignore=tests/test_lean_gate.py

  proof:
    name: proof (Lean gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[test]'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            proof/langlands/.lake
          key: lean-${{ hashFiles('proof/langlands/lean-toolchain', 'proof/langlands/lake-manifest.json') }}
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: python -m pytest tests/test_lean_gate.py
